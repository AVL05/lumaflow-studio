map $args $seo_query_policy {
    default "";
    ~*(^|&)(token|signature|email)= "noindex, nofollow, nosnippet";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    add_header X-Robots-Tag $seo_query_policy always;
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html { return 308 /; }
    location = / {
        if ($seo_query_policy != "") { rewrite ^ /app-shell.html last; }
        try_files /index.html =404;
    }
    location ~ ^/security/?$ { return 308 /privacy; }
    location ~ ^/(features|pricing|privacy|about-project|support)(/|\.html)$ {
        return 308 /$1;
    }
    location ~ ^/(features|pricing|privacy|about-project|support)$ {
        if ($seo_query_policy != "") { rewrite ^ /app-shell.html last; }
        try_files /$1.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(app(/.*)?|login|register|forgot-password|reset-password|verify-email|onboarding|getting-started|demo|deliver/[^/]+|contract/[^/]+|book/[^/]+|app-shell\.html)/?$ {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /app-shell.html =404;
    }
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
