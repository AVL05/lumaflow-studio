name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test audit policy
        run: pnpm run test:audit

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Audit complete dependency tree
        shell: bash
        run: |
          set +e
          pnpm audit --json > dependency-audit.json
          audit_status=$?
          set -e
          node scripts/check-security-audit.mjs dependency-audit.json "$audit_status"

      - name: Upload complete security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: dependency-audit.json
          retention-days: 7

      - name: Check formatting
        run: pnpm --dir frontend run format:check

      - name: Lint
        run: pnpm --dir frontend run lint

      - name: Test
        run: pnpm --dir frontend run test

      - name: Build PWA
        run: pnpm --dir frontend run build
        env:
          VITE_API_URL: https://lumaflow-api.aleviclop.dev/api

      - name: Check bundle budget
        run: pnpm --dir frontend run check:bundle

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        run: pnpm --dir frontend run build
        env:
          VITE_API_URL: https://lumaflow-api.aleviclop.dev/api

      - name: Lighthouse CI (landing and login)
        working-directory: frontend
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        working-directory: backend
        run: composer audit --locked

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP style
        working-directory: backend
        run: php vendor/bin/pint --test

      - name: Test
        working-directory: backend
        run: php artisan test

  backend-mysql:
    name: Backend on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lumaflow_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lumaflow_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations from scratch
        working-directory: backend
        run: php artisan migrate --force

      - name: Feature tests on MySQL
        working-directory: backend
        run: php artisan test --testsuite=Feature

  backend-postgres:
    name: Backend on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumaflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lumaflow_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lumaflow_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations from scratch
        working-directory: backend
        run: php artisan migrate --force

      - name: Feature tests on PostgreSQL
        working-directory: backend
        run: php artisan test --testsuite=Feature

  e2e:
    name: E2E journeys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PWA upgrade regression builds the frozen pre-SEO source

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test:e2e

      - name: Build public HTML and PWA
        run: pnpm run build

      - name: Verify optional support providers
        run: pnpm run test:support

      - name: Verify SEO and PWA regressions
        run: pnpm run test:pwa

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/pwa/
            e2e/test-results/support/
          retention-days: 7

  containers:
    name: Deployment images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file backend/Dockerfile backend

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile .
