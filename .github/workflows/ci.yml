name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test audit policy
        run: pnpm run test:audit

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Audit complete dependency tree
        shell: bash
        run: |
          set +e
          pnpm audit --json > dependency-audit.json
          audit_status=$?
          set -e
          node scripts/check-security-audit.mjs dependency-audit.json "$audit_status"

      - name: Upload complete security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: dependency-audit.json
          retention-days: 7

      - name: Check formatting
        run: pnpm --dir frontend run format:check

      - name: Lint
        run: pnpm --dir frontend run lint

      - name: Test
        run: pnpm --dir frontend run test

      - name: Build PWA
        run: pnpm --dir frontend run build
        env:
          VITE_API_URL: https://lumaflow-api.aleviclop.dev/api

      - name: Check bundle budget
        run: pnpm --dir frontend run check:bundle

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        run: pnpm --dir frontend run build
        env:
          VITE_API_URL: https://lumaflow-api.aleviclop.dev/api

      - name: Lighthouse CI (landing and login)
        working-directory: frontend
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        working-directory: backend
        run: composer audit --locked

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP style
        working-directory: backend
        run: php vendor/bin/pint --test

      - name: Test
        working-directory: backend
        run: php artisan test

  backend-mysql:
    name: Backend on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lumaflow_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lumaflow_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations from scratch
        working-directory: backend
        run: php artisan migrate --force

      - name: Feature tests on MySQL
        working-directory: backend
        run: php artisan test --testsuite=Feature

  backend-postgres:
    name: Backend on PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumaflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lumaflow_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lumaflow_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations from scratch
        working-directory: backend
        run: php artisan migrate --force

      - name: Feature tests on PostgreSQL
        working-directory: backend
        run: php artisan test --testsuite=Feature

      - name: Backup and restore drill on PostgreSQL
        working-directory: backend
        env:
          BACKUP_PATH: ${{ runner.temp }}/lumaflow-backups
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          command -v pg_dump >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          source_tables=$(psql -h 127.0.0.1 -U postgres -d lumaflow_ci -tAc "select count(*) from information_schema.tables where table_schema='public'")
          php artisan data:backup --no-interaction
          file=$(basename "$(ls "$BACKUP_PATH"/lumaflow-db-*-pgsql.sql.gz | head -1)")
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE lumaflow_restore"
          DB_DATABASE=lumaflow_restore php artisan data:restore "$file" --apply --force --no-interaction
          restored_tables=$(psql -h 127.0.0.1 -U postgres -d lumaflow_restore -tAc "select count(*) from information_schema.tables where table_schema='public'")
          echo "tablas origen=$source_tables restauradas=$restored_tables"
          [ "$source_tables" = "$restored_tables" ] && [ "$restored_tables" -gt 0 ]
          restored_migrations=$(psql -h 127.0.0.1 -U postgres -d lumaflow_restore -tAc "select count(*) from migrations")
          [ "$restored_migrations" -gt 0 ]

  e2e:
    name: E2E journeys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PWA upgrade regression builds the frozen pre-SEO source

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test:e2e

      - name: Build public HTML and PWA
        run: pnpm run build

      - name: Verify optional support providers
        run: pnpm run test:support

      - name: Verify SEO and PWA regressions
        run: pnpm run test:pwa

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/pwa/
            e2e/test-results/support/
          retention-days: 7

  containers:
    name: Deployment images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag lumaflow-api:ci backend

      - name: Smoke the backend image (FrankenPHP serves /up and concurrent requests)
        run: |
          # Sin capabilities ni privilegios nuevos, como en Render: con las de Docker por defecto el
          # binario arrancaba aqui y fallaba en produccion (`exec: Operation not permitted`).
          docker run -d --name lumaflow-api -p 8080:8080 --cap-drop=ALL --security-opt no-new-privileges \
            -e PORT=8080 -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY="$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci.sqlite \
            -e CACHE_STORE=file -e SESSION_DRIVER=file -e QUEUE_CONNECTION=sync \
            --entrypoint sh lumaflow-api:ci \
            -c 'touch /tmp/ci.sqlite && exec entrypoint frankenphp run --config /etc/caddy/Caddyfile'
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "${ok:-0}" = "1" ] || { docker logs lumaflow-api; exit 1; }
          # Varias peticiones a la vez: el servidor de desarrollo las serializaba.
          for i in 1 2 3 4 5 6; do curl -fsS -o /dev/null http://localhost:8080/up & done; wait
          curl -fsS -D - -o /dev/null http://localhost:8080/api/health | head -1

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile .
