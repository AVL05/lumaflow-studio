name: Production backup

# Backup diario de la base de datos de produccion (PostgreSQL en Supabase) sin servicios de pago:
# pg_dump del esquema `lumaflow`, verificacion del volcado, cifrado con una passphrase y subida
# como artefacto del workflow (30 dias). El repositorio es publico, asi que el artefacto SIEMPRE
# va cifrado: sin la passphrase no se puede leer. La passphrase vive en el secreto
# BACKUP_ENCRYPTION_PASSPHRASE y el responsable debe guardar una copia aparte (los secretos de
# GitHub no se pueden leer despues). Restauracion: docs/backup-recovery.md.

on:
  schedule:
    - cron: "0 3 * * *" # UTC; GitHub puede retrasar los trabajos programados.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted database backup
    if: github.repository == 'AVL05/lumaflow-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Install PostgreSQL 17 client (pg_dump must not be older than the server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump, verify and encrypt
        id: dump
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          LOG_CHANNEL: stderr
          CACHE_STORE: file
          DB_CONNECTION: pgsql
          DB_SCHEMA: lumaflow
          DB_SSLMODE: require
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_DATABASE: ${{ secrets.PROD_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_PATH: ${{ runner.temp }}/lumaflow-backups
        run: |
          set -euo pipefail
          umask 077
          for key in DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD BACKUP_ENCRYPTION_PASSPHRASE; do
            if [ -z "${!key:-}" ]; then echo "::error::Falta el secreto para $key (ver docs/backup-recovery.md)"; exit 1; fi
          done
          export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"

          php artisan data:backup --no-interaction
          file=$(ls "$BACKUP_PATH"/lumaflow-db-*-pgsql.sql.gz | head -1)
          php artisan data:restore "$(basename "$file")" --no-interaction   # verificacion del volcado
          sha256sum "$file" | cut -d' ' -f1 > "$file.sha256.txt"

          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$file" -out "$file.enc" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          # Comprobar que el cifrado es reversible antes de dar el backup por bueno.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$file.enc" -out "$file.check" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          [ "$(sha256sum "$file.check" | cut -d' ' -f1)" = "$(cat "$file.sha256.txt")" ]
          rm -f "$file.check" "$file"

          echo "name=$(basename "$file").enc" >> "$GITHUB_OUTPUT"
          echo "Backup cifrado y verificado: $(basename "$file").enc" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v7
        with:
          name: lumaflow-db-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lumaflow-backups/*.enc
            ${{ runner.temp }}/lumaflow-backups/*.sha256.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary dumps
        if: always()
        run: rm -rf -- "${{ runner.temp }}/lumaflow-backups"

      - name: Open an incident when the backup fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label incident --state open --search "Backup" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label incident \
              --title "El backup de produccion ha fallado ($(date -u +%Y-%m-%d) UTC)" \
              --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Causas habituales: secretos PROD_DB_* o BACKUP_ENCRYPTION_PASSPHRASE ausentes o caducados, o la base de datos inaccesible."
          fi
